; BeastVR settings. Lives next to beastvr.dll and BeastVR Launcher.exe.

[game]
; The game's exe name exactly as Task Manager > Details shows it.
; Fill this in during Phase 0 (and record it in docs/RECON.md).
game_process=CHANGE_ME.exe

; How long to wait after the game process appears before loading BeastVR,
; in milliseconds. Gives the game time to finish starting up.
inject_delay_ms=3000

[debug]
; 1 = check the OpenXR runtime and headset at startup and log what it finds.
openxr_probe=1
